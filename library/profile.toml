contract = 1
id = "library"
name = "Typed library"
description = "A typed library for PyPI: py.typed, a small __all__ API, docstrings, a changelog, and a CI workflow for 3.11 and 3.13."
version = "1"
kind = "library"
status = "stable"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
default_components = []
optional_components = []
dependencies = []
questions = ["description", "author", "email", "python_version", "license"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
security_posture = "No network access, secrets, or services are needed. The CI workflow uses GitHub Actions with read-only repository permissions. The checks do not scan dependencies or code for security problems."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
