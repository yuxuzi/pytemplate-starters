contract = 1
id = "script"
name = "Python script"
description = "One package with a main() entry point, a console command, and one tested function. Standard library only."
version = "1"
kind = "cli"
status = "stable"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
default_components = []
optional_components = []
dependencies = []
questions = ["description", "author", "email", "python_version", "license"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
security_posture = "Standard library only, with no network access, secrets, or services. The checks do not scan dependencies or code for security problems."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
